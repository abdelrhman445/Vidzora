services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  bot:
    build: .
    command: python -m src.main
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - mongo
    volumes:
      - ./temp:/app/temp
      - ./assets:/app/assets

  worker:
    build: .
    command: celery -A src.celery_app.celery worker --loglevel=info -Q video_pipeline --concurrency=2
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - mongo
    volumes:
      - ./temp:/app/temp
      - ./assets:/app/assets

  beat:
    build: .
    command: celery -A src.celery_app.celery beat --loglevel=info
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - mongo

volumes:
  redis_data:
  mongo_data:
